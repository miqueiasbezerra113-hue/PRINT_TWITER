<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moldura de Tweet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@400;600;700&family=DM+Sans:wght@400;600;700&family=Nunito+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--tx:#14171a;--mut:#657786;--bd:#d9dde1;--ac:#1d9bf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--panel:#1a1d21;--tx:#e8eaed;--mut:#8b98a5;--bd:#2f3336}}
:root[data-theme="dark"]{--bg:#0e1013;--panel:#1a1d21;--tx:#e8eaed;--mut:#8b98a5;--bd:#2f3336}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px;display:grid;gap:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
input[type=text],textarea,select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}
button{padding:12px;border:0;border-radius:999px;background:var(--ac);color:#fff;font:600 15px inherit;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);font-size:14px}
.stage{margin:20px 0;overflow-x:auto}
#card{width:560px;padding:16px 18px;border-radius:16px;border:1px solid;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#card.light{background:#fff;color:#0f1419;border-color:#cfd9de;--m:#536471}
#card.dim{background:#15202b;color:#f7f9f9;border-color:#38444d;--m:#8b98a5}
#card.black{background:#000;color:#e7e9ea;border-color:#2f3336;--m:#71767b}
.h{display:flex;gap:12px;align-items:center}
.av{width:72px;height:72px;border-radius:50%;background:#1d9bf0 center/cover;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:30px;flex:none}
.nm{font-weight:700;font-size:24px;display:flex;align-items:center;gap:4px}
.hd{color:var(--m);font-size:20px}
.tx{font-size:var(--fs,22px);font-weight:var(--fw,400);line-height:1.35;margin:14px 0;white-space:pre-wrap;word-wrap:break-word}
#pimg{width:100%;border-radius:16px;margin-bottom:12px;display:none;position:relative;overflow:hidden;background:rgba(128,128,128,.2) center/cover no-repeat}
.meta{color:var(--m);font-size:15px;padding:12px 0;border-top:1px solid;border-color:inherit}
.st{display:flex;gap:28px;color:var(--m);font-size:14px;padding-top:12px;border-top:1px solid;border-color:inherit}
.st span{display:flex;align-items:center;gap:6px}
.st svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
#out{display:none;text-align:center}
#out img{max-width:100%;border-radius:12px;border:1px solid var(--bd)}
#out p{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Moldura de Tweet</h1>
<p class="s">Preencha, gere o PNG e salve a imagem.</p>

<div class="panel">
  <div class="row">
    <label>Nome<input type="text" id="nome" value="Seu Nome"></label>
    <label>@usuário<input type="text" id="user" value="seuuser"></label>
  </div>
  <label>Texto do post<textarea id="texto">Escreva aqui o texto do seu post.</textarea></label>
  <div class="row">
    <label>Fonte<select id="ff"><option value="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Instagram (padrão do celular)</option><option value="'Poppins',sans-serif">Poppins</option><option value="'Montserrat',sans-serif">Montserrat</option><option value="'DM Sans',sans-serif">DM Sans</option><option value="'Nunito Sans',sans-serif">Nunito Sans</option></select></label>
    <label>Formato da imagem<select id="rt"><option value="1.25">4:5 (retrato)</option><option value="1.7778">9:16 (vertical)</option><option value="1">1:1 (quadrada)</option><option value="orig">Original</option><option value="none">Sem espaço de imagem</option></select></label>
  </div>
  <div class="row">
    <label>Tamanho do texto: <span id="fsv">22</span> px<input type="range" id="fs" min="14" max="40" value="22"></label>
    <label class="chk" style="align-self:end;padding-bottom:6px"><input type="checkbox" id="fb"> Texto em negrito</label>
  </div>
  <div class="row">
    <label>Foto de perfil<input type="file" id="avf" accept="image/*"></label>
    <label>Imagem ou vídeo no post<input type="file" id="imf" accept="image/*,video/*"></label>
  </div>
  <div class="row">
    <label>Tema<select id="tema"><option value="light">Claro</option><option value="dim">Azulado</option><option value="black">Preto</option></select></label>
    <label>Data e hora<input type="text" id="data" value="9:41 AM · 5 de nov. de 2026"></label>
  </div>
  <div class="row3">
    <label>Comentários<input type="text" id="c1" value="128"></label>
    <label>Retweets<input type="text" id="c2" value="2,4 mil"></label>
    <label>Curtidas<input type="text" id="c3" value="18 mil"></label>
  </div>
  <label class="chk"><input type="checkbox" id="ver" checked> Selo de verificado</label>
  <div class="row"><button type="button" class="sec" id="psave">Salvar como minha predefinição</button><button type="button" class="sec" id="pdel">Apagar predefinição</button></div>
  <div id="pm" style="font-size:13px;color:var(--mut)"></div>
</div>

<div class="stage"><div id="card" class="light">
  <div class="h">
    <div class="av" id="av">S</div>
    <div>
      <div class="nm"><span id="pn"></span>
        <svg id="badge" width="24" height="24" viewBox="0 0 24 24"><path fill="#1d9bf0" d="M22.5 12.5l-2-2.3.3-3-3-.7-1.6-2.6-2.8 1.2-2.8-1.2L8.9 6.5l-3 .7.3 3-2 2.3 2 2.3-.3 3 3 .7 1.6 2.6 2.8-1.2 2.8 1.2 1.6-2.6 3-.7-.3-3z"/><path fill="none" stroke="#fff" stroke-width="2" d="M8 12.5l2.6 2.6L16 9.6"/></svg>
      </div>
      <div class="hd" id="pu"></div>
    </div>
  </div>
  <div class="tx" id="pt"></div>
  <div id="pimg"><video id="pv" muted loop playsinline style="display:none;position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover"></video></div>
  <div class="meta" id="pd"></div>
  <div class="st">
    <span><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><b id="s1" style="font-weight:600"></b></span>
    <span><svg viewBox="0 0 24 24"><path d="M4 9l3-3 3 3M7 6v9a3 3 0 003 3h4M20 15l-3 3-3-3M17 18V9a3 3 0 00-3-3h-4"/></svg><b id="s2" style="font-weight:600"></b></span>
    <span><svg viewBox="0 0 24 24"><path d="M12 20s-8-4.9-8-11a4.5 4.5 0 018-2.7A4.5 4.5 0 0120 9c0 6.1-8 11-8 11z"/></svg><b id="s3" style="font-weight:600"></b></span>
  </div>
</div></div>

<button id="go">Gerar PNG</button>
<button id="gv" type="button" style="margin-top:10px;width:100%">Gerar vídeo 9:16 (fundo branco)</button>
<div id="vm" style="font-size:13px;color:var(--mut);margin-top:8px">Para o vídeo: escolha um vídeo no campo acima e deixe esta tela aberta durante a gravação.</div>
<div id="vout" style="display:none;text-align:center;margin-top:16px"><video id="vres" controls playsinline style="max-width:100%;max-height:70vh;border-radius:12px;border:1px solid var(--bd)"></video><div><button id="vsave" type="button" style="margin-top:10px;width:100%">Salvar vídeo</button></div></div>
<div id="out"><p>Pronto. Segure a imagem (celular) ou clique com o botão direito (computador) e salve.</p><img id="res" alt="Tweet em PNG"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function sync(){
  $('pn').textContent=$('nome').value;
  $('pu').textContent='@'+$('user').value.replace('@','');
  $('pt').textContent=$('texto').value;
  $('pd').textContent=$('data').value;
  $('s1').textContent=$('c1').value;$('s2').textContent=$('c2').value;$('s3').textContent=$('c3').value;
  $('badge').style.display=$('ver').checked?'block':'none';
  $('card').className=$('tema').value;
  $('card').style.fontFamily=$('ff').value;
  $('card').style.setProperty('--fs',$('fs').value+'px');
  $('card').style.setProperty('--fw',$('fb').checked?'700':'400');
  $('fsv').textContent=$('fs').value;
  fit();
  var a=$('av');if(!a.dataset.img)a.textContent=($('nome').value||'?').charAt(0).toUpperCase();
}
['nome','user','texto','data','c1','c2','c3','ver','tema','ff','fs','fb','rt'].forEach(function(i){$(i).addEventListener('input',sync);$(i).addEventListener('change',sync)});
var imgData='',imgRatio=1;
function fit(){var i=$('pimg'),r=$('rt').value;if(r==='none'){i.style.display='none';return}i.style.display='block';i.style.backgroundImage=imgData?'url('+imgData+')':'none';var k=r==='orig'?(imgData?imgRatio:1.25):parseFloat(r);i.style.height=Math.round(i.clientWidth*k)+'px'}
function load(f,cb){var r=new FileReader();r.onload=function(){cb(r.result)};r.readAsDataURL(f)}
$('avf').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;load(f,function(d){setAv(d)})});
$('imf').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;if(f.type.indexOf('video')===0){setVideo(f);return}clearVideo();load(f,function(d){var t=new Image();t.onload=function(){imgData=d;imgRatio=t.naturalHeight/t.naturalWidth;fit()};t.src=d})});
$('go').addEventListener('click',function(){
  var b=$('go');b.textContent='Gerando...';
  var bg={light:'#ffffff',dim:'#15202b',black:'#000000'}[$('tema').value];
  (document.fonts?document.fonts.ready:Promise.resolve()).then(function(){return html2canvas($('card'),{scale:3,backgroundColor:null,useCORS:true})}).then(function(c){
    $('res').src=c.toDataURL('image/png');$('out').style.display='block';
    b.textContent='Gerar PNG';$('out').scrollIntoView({behavior:'smooth'});
  }).catch(function(){b.textContent='Erro, tente de novo'});
});
var avData='';
function setAv(d){avData=d;var a=$('av');if(d){a.style.backgroundImage='url('+d+')';a.dataset.img=1;a.textContent=''}else{a.style.backgroundImage='none';delete a.dataset.img}sync()}
var KEYS=['nome','user','tema','ff','fs','rt'];
function shrink(d,cb){if(!d)return cb('');var t=new Image();t.onload=function(){var s=256,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d');var m=Math.min(t.naturalWidth,t.naturalHeight);x.drawImage(t,(t.naturalWidth-m)/2,(t.naturalHeight-m)/2,m,m,0,0,s,s);cb(c.toDataURL('image/jpeg',0.9))};t.src=d}
function msg(t){$('pm').textContent=t}
$('psave').addEventListener('click',function(){shrink(avData,function(a){var p={av:a,fb:$('fb').checked,ver:$('ver').checked};KEYS.forEach(function(k){p[k]=$(k).value});try{localStorage.setItem('tweet-preset',JSON.stringify(p));msg('Predefinição salva neste navegador.')}catch(e){msg('Não foi possível salvar aqui.')}})});
$('pdel').addEventListener('click',function(){try{localStorage.removeItem('tweet-preset');msg('Predefinição apagada.')}catch(e){}});
try{var raw=localStorage.getItem('tweet-preset');if(raw){var p=JSON.parse(raw);KEYS.forEach(function(k){if(p[k]!==undefined)$(k).value=p[k]});$('fb').checked=!!p.fb;$('ver').checked=p.ver!==false;if(p.av)setAv(p.av);msg('Predefinição carregada.')}}catch(e){}
var vurl='',vblob=null,vext='mp4';
function vmsg(t){$('vm').textContent=t}
function clearVideo(){var v=$('pv');v.pause();v.removeAttribute('src');v.style.display='none';if(vurl)URL.revokeObjectURL(vurl);vurl='';$('vout').style.display='none'}
function setVideo(f){clearVideo();imgData='';vurl=URL.createObjectURL(f);var v=$('pv');v.onloadedmetadata=function(){imgRatio=v.videoHeight/v.videoWidth;v.style.display='block';fit();v.play().catch(function(){})};v.onerror=function(){vmsg('Este vídeo está em H.265 (HEVC) ou outro formato que o navegador não abre. Converta para MP4 H.264 e escolha de novo.')};v.src=vurl;fit()}
function rpath(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
$('gv').addEventListener('click',async function(){
  if(!vurl){vmsg('Escolha um vídeo no campo "Imagem ou vídeo no post" primeiro.');return}
  var b=$('gv');b.disabled=true;vmsg('Preparando a moldura...');
  try{
    if(document.fonts)await document.fonts.ready;
    var card=$('card'),W=1080,H=1920,m=48;
    var s=Math.min((W-2*m)/card.offsetWidth,(H-2*m)/card.offsetHeight);
    var pv=$('pv');pv.style.visibility='hidden';
    var cc=await html2canvas(card,{scale:s,backgroundColor:null,useCORS:true});
    pv.style.visibility='visible';
    var cr=card.getBoundingClientRect(),pr=$('pimg').getBoundingClientRect();
    var ox=(W-cc.width)/2,oy=(H-cc.height)/2;
    var mx=ox+(pr.left-cr.left)*s,my=oy+(pr.top-cr.top)*s,mw=pr.width*s,mh=pr.height*s;
    var rv=document.createElement('video');rv.src=vurl;rv.playsInline=true;
    await new Promise(function(r){rv.onloadeddata=r;rv.load()});
    var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
    var stream=c.captureStream(30);
    try{var AC=window.AudioContext||window.webkitAudioContext;var ac=new AC();var src=ac.createMediaElementSource(rv);var dst=ac.createMediaStreamDestination();src.connect(dst);dst.stream.getAudioTracks().forEach(function(t){stream.addTrack(t)});await ac.resume()}catch(e){}
    var mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(function(t){return window.MediaRecorder&&MediaRecorder.isTypeSupported(t)});
    var rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:8000000}:{videoBitsPerSecond:8000000});
    var chunks=[];rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    var stopped=new Promise(function(r){rec.onstop=r});
    var sw=rv.videoWidth,sh=rv.videoHeight,ar=mw/mh,sx,sy,sW,sH;
    if(sw/sh>ar){sH=sh;sW=sh*ar;sx=(sw-sW)/2;sy=0}else{sW=sw;sH=sw/ar;sx=0;sy=(sh-sH)/2}
    function draw(){
      x.fillStyle='#ffffff';x.fillRect(0,0,W,H);x.drawImage(cc,ox,oy);
      x.save();rpath(x,mx,my,mw,mh,16*s);x.clip();x.drawImage(rv,sx,sy,sW,sH,mx,my,mw,mh);x.restore();
      if(rv.duration)vmsg('Gravando... '+Math.min(99,Math.round(rv.currentTime/rv.duration*100))+'%');
      if(!rv.ended&&!rv.paused)requestAnimationFrame(draw);
    }
    rv.onended=function(){draw();setTimeout(function(){rec.stop()},150)};
    rec.start();await rv.play();draw();
    await stopped;
    var type=(rec.mimeType||mt||'video/webm').split(';')[0];
    vblob=new Blob(chunks,{type:type});vext=type.indexOf('mp4')>=0?'mp4':'webm';
    $('vres').src=URL.createObjectURL(vblob);$('vout').style.display='block';
    vmsg('Pronto! Confira abaixo e toque em Salvar vídeo.');
    $('vout').scrollIntoView({behavior:'smooth'});
  }catch(e){vmsg('Não consegui gerar o vídeo neste navegador. Tente no Chrome.');$('pv').style.visibility='visible'}
  b.disabled=false;
});
$('vsave').addEventListener('click',async function(){
  try{
    var d=(window.claude&&claude.use)?await claude.use('downloads'):null;
    if(!d){vmsg('Salvar direto não está disponível aqui: segure o vídeo e escolha baixar.');return}
    await d.save({filename:'tweet-video.'+vext,data:vblob});
  }catch(e){if(!e||e.code!=='declined')vmsg('Não foi possível salvar. Segure o vídeo e escolha baixar.')}
});
sync();
</script>
</body>
</html>
